<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f6f2">
<title>my-first-page｜ツール一覧</title>
<style>
:root{--ink:#1e3028;--muted:#718078;--green:#2e624d;--paper:#fffefa;--line:#e4e9e3;--cream:#f5f6f2;--shadow:0 18px 45px #1c352512}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.6}a{color:inherit}.page{max-width:1020px;margin:0 auto;padding:26px 24px 48px}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;letter-spacing:.04em}.mark{width:34px;height:34px;background:var(--green);color:white;border-radius:11px;display:grid;place-items:center}.badge{border:1px solid var(--line);color:var(--muted);background:#fff;border-radius:99px;padding:6px 11px;font-size:10px}.hero{padding:84px 0 54px;max-width:720px}.eyebrow{color:var(--green);font-size:11px;letter-spacing:.16em;font-weight:800}.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.18;letter-spacing:-.055em;margin:13px 0 14px}.hero p{font-size:15px;color:var(--muted);margin:0;max-width:560px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{position:relative;display:flex;flex-direction:column;min-height:275px;padding:25px;background:var(--paper);border:1px solid var(--line);border-radius:19px;text-decoration:none;box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;overflow:hidden}.card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 22px 50px #1c35251d;border-color:#b9cbbd;outline:0}.card:focus-visible{outline:3px solid #8db59b;outline-offset:3px}.card-top{display:flex;justify-content:space-between;align-items:center}.icon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:24px}.icon.food{background:#f7eee3}.icon.team{background:#e9f1e9}.arrow{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:#f2f4ef;color:var(--green);font-size:16px}.card h2{font-size:20px;letter-spacing:-.03em;margin:22px 0 6px}.card p{font-size:13px;color:var(--muted);margin:0;max-width:380px}.action{display:flex;align-items:center;gap:8px;color:var(--green);font-size:12px;font-weight:750;margin-top:auto;padding-top:27px}.action span:last-child{font-size:17px;transition:transform .18s}.card:hover .action span:last-child{transform:translateX(4px)}.foot{margin-top:40px;border-top:1px solid var(--line);padding-top:17px;display:flex;justify-content:space-between;color:#96a098;font-size:10px}
@media(max-width:640px){.page{padding:18px 16px 30px}.hero{padding:55px 0 31px}.hero h1{font-size:38px}.hero p{font-size:13px}.cards{grid-template-columns:1fr;gap:12px}.card{min-height:220px;padding:20px}.card h2{font-size:18px;margin-top:17px}.foot{margin-top:27px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="page">
<header class="top"><div class="brand"><span class="mark">m</span><span>my-first-page</span></div><span class="badge">TOOLS</span></header>
<section class="hero"><div class="eyebrow">WELCOME</div><h1>使いたいツールへ、<br>すぐアクセス。</h1><p>宴会の仕込み量を計算するツールと、チームのプロジェクトを管理するツールをまとめました。</p></section>
<nav class="cards" aria-label="ツール一覧">
<a class="card" href="./enkai/">
<div class="card-top"><span class="icon food" aria-hidden="true">🍲</span><span class="arrow" aria-hidden="true">↗</span></div>
<h2>宴会仕込みナビ</h2><p>人数とコースから食材ごとの仕込み量と、卸への発注締切を確認。</p><span class="action"><span>ツールを開く</span><span>→</span></span>
</a>
<a class="card" href="./idea1/">
<div class="card-top"><span class="icon team" aria-hidden="true">▦</span><span class="arrow" aria-hidden="true">↗</span></div>
<h2>チームボード</h2><p>プロジェクトのタスクを担当・期限・進捗ごとにチームで整理。</p><span class="action"><span>ツールを開く</span><span>→</span></span>
</a>
</nav>
<footer class="foot"><span>my-first-page</span><span>必要なページを選んでください</span></footer>
</main>
</body>
</html>
